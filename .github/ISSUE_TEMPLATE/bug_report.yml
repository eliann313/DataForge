name: Reporte de bug
description: Reportar un comportamiento incorrecto de DataForge
title: "[bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasa y qué se esperaba que pasara.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      description: Enumerar los pasos con un archivo mínimo si aplica.
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador y versión
      description: Ej.: Chromium 156, Firefox 157.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Sistema operativo y rama/commit
      description: Ej.: Windows 11, develop @387ee4b.
  - type: input
    id: datos
    attributes:
      label: Tamaño aproximado de los datos
      description: Filas × columnas y bytes del archivo, si aplica.
  - type: checkboxes
    id: checklist
    attributes:
      label: Verificaciones
      options:
        - label: Puedo adjuntar un archivo mínimo que reproduzca el bug
        - label: Revisé que no sea una limitación documentada (README/ADR)
